name: Draft prerelease
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed version tag
        required: true
        type: string
permissions:
  contents: read
jobs:
  package-macos:
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate version tag
        run: node -e "const p=require('./desktop/package.json'); if(process.env.RELEASE_TAG!=='v'+p.version)process.exit(1)"
      - run: npm ci && npm run setup
      - run: npm run scan && npm test && npm run package
      - name: Archive application
        run: |
          node scripts/archive-release.mjs
      - name: Create draft only
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" desktop/release/assets/* --verify-tag --draft --prerelease --title "$RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
